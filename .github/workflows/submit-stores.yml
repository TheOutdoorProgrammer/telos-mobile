name: Submit to App Stores

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to submit'
        required: true
        type: choice
        options:
          - ios
          - android
          - both

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Submit iOS to App Store
        if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' }}
        run: |
          echo "Submitting iOS build to App Store..."
          eas submit --platform ios --profile production --latest --non-interactive
        continue-on-error: true

      - name: Submit Android to Play Store
        if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}
        run: |
          echo "Submitting Android build to Play Store..."
          eas submit --platform android --profile production --latest --non-interactive
        continue-on-error: true

      - name: Summary
        run: |
          echo "### Store Submission Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Platform(s) submitted: ${{ github.event.inputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the EAS dashboard for submission status:" >> $GITHUB_STEP_SUMMARY
          echo "https://expo.dev/accounts/${{ github.repository_owner }}/projects/telos/submissions" >> $GITHUB_STEP_SUMMARY
